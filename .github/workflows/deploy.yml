name: Radar update and GitHub Pages deploy

on:
  push:
    branches: [main, master]
  schedule:
    # 12:00 Asia/Shanghai / 13:00 Asia/Tokyo is intentionally close to the requested daily window.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      limit_per_query:
        description: "arXiv candidates per query during this run"
        required: false
        default: "5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate code
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/radar/*.py scripts/*.py

      - name: Fetch, score and enrich radar
        run: |
          LIMIT="${{ inputs.limit_per_query || '5' }}"
          python scripts/update_radar.py --fetch --limit-per-query "$LIMIT" --threshold 45
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          ARXIV_USER_AGENT: "EmbodiedResearchRadar/0.1 (GitHub Actions; owner=Nicholas-Steven)"
          ARXIV_DELAY_SECONDS: "4"

      - name: Build static site
        run: python scripts/build_site.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json site
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "chore: update research radar [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
