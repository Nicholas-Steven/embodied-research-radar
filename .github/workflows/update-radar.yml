# Update the main paper radar with new arXiv papers.
#
# Ingestion (hardened 2026-09-15):
# - Primary source: arXiv OAI-PMH (one ListRecords per category set, 7-day
#   rolling window). Fallback: one broad Search API submittedDate query.
# - scripts/update_radar.py exits non-zero when the source is unhealthy
#   (all requests 429-exhausted / partial harvest), so this workflow FAILS
#   instead of producing a green "empty day".
# - papers.json is only rewritten when the dataset actually changed, so the
#   commit step naturally stays silent on healthy zero-new runs.
# - Health counters are written to GITHUB_STEP_SUMMARY by the pipeline.

name: Update Radar

on:
  schedule:
    - cron: "0 4 * * *"   # Daily 04:00 UTC = 12:00 Beijing
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Rolling harvest window in days (backfill-safe)"
        required: false
        default: "7"

permissions:
  contents: write

concurrency:
  group: radar-data-mutation
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  RADAR_LOOKBACK_DAYS: "7"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch, score and enrich radar
        id: radar
        run: |
          export RADAR_LOOKBACK_DAYS="${{ inputs.lookback_days || '7' }}"
          python scripts/update_radar.py --fetch --threshold 45
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          ARXIV_USER_AGENT: "EmbodiedResearchRadar/1.0 (GitHub Actions; https://github.com/Nicholas-Steven/embodied-research-radar)"
          ARXIV_MAX_RETRIES: "5"
          ARXIV_BACKOFF_BASE_SECONDS: "30"
          ARXIV_BACKOFF_MAX_SECONDS: "300"

      - name: Rebuild landscape
        run: python scripts/build_landscape.py

      - name: Validate
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/radar/*.py scripts/*.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json data/research_landscape.json
          if git diff --cached --quiet; then
            echo "No dataset change (healthy run, zero new papers) — nothing to commit"
          else
            git commit -m "chore(data): update research radar"
            git push
          fi
